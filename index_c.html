<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b2230;--mut:#667085;--bd:#d9dee8;--pr:#1d4ed8;--ok:#15803d;--okb:#dcfce7;--vb:#dbeafe;--vbd:#3b82f6;--no:#b91c1c;--nob:#fee2e2}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f1420;--card:#171d2b;--tx:#e8ecf4;--mut:#9aa4b8;--bd:#2c3547;--pr:#6b95ff;--ok:#4ade80;--okb:#12301f;--vb:#172a4d;--vbd:#60a5fa;--no:#f87171;--nob:#3a1717}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0}button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 16px;border-radius:8px}
button.p{background:var(--pr);color:#fff;border-color:var(--pr)}button:disabled{opacity:.4;cursor:default}
.c{max-width:1100px;margin:20px auto;padding:0 16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px}
.start{text-align:center;padding:60px 20px}.start h2{font-size:28px}.start p{color:var(--mut)}
.lay{display:grid;grid-template-columns:230px 1fr;gap:16px}
.side{max-height:78vh;overflow:auto;padding:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.n{padding:6px 0;text-align:center;font-size:13px}.n.d{background:var(--okb);border-color:var(--ok)}.n.v{background:var(--vb);border-color:var(--vbd)}.n.cur{outline:2px solid var(--pr)}.n.w{background:var(--nob);border-color:var(--no)}
.meta{color:var(--mut);font-size:14px;margin-bottom:8px}.q{font-size:18px;margin:0 0 16px}
.o{display:block;width:100%;text-align:start;margin-bottom:8px;padding:12px 14px}.o.sel{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,transparent)}
.o.ok{background:var(--okb);border-color:var(--ok)}.o.bad{background:var(--nob);border-color:var(--no)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
.res{text-align:center}.big{font-size:44px;font-weight:700}.pass{color:var(--ok)}.fail{color:var(--no)}
.rv{margin-top:16px;text-align:start}.tag{font-size:13px;margin-top:4px}
@media(max-width:700px){.lay{grid-template-columns:1fr}.side{max-height:150px}}
</style>

function render(){head();if(mode=='start')return app.innerHTML=`<div class="card start"><h2>${t('st')}</h2><p>${Q.length} ${t('sub')}</p><button class="p" onclick="mode='exam';render()">${t('go')}</button></div>`;
if(mode=='exam'){const q=Q[cur];V[cur]=1;app.innerHTML=`<div class="lay">${side(0)}<div class="card"><div class="meta">${t('q')} ${cur+1} ${t('of')} ${Q.length} · ${t('an')}: ${A.filter(x=>x!==undefined).length}</div><p class="q" ${dq(q)}>${qText(q)}</p>${opts(q).map((o,k)=>`<button class="o${A[cur]===k?' sel':''}" ${dro(q)} onclick="pick(${k})">${o}</button>`).join('')}<div class="nav"><button onclick="go(${cur-1})" ${cur==0?'disabled':''}>${t('pv')}</button><button class="p" onclick="submit()">${t('sb')}</button><button onclick="go(${cur+1})" ${cur==Q.length-1?'disabled':''}>${t('nx')}</button></div></div></div>`;return}
const ans=A.filter(x=>x!==undefined).length,ok=A.filter((x,k)=>x===Q[k].c).length,p=ans?Math.round(ok/ans*1000)/10:0,pass=p>=70;
app.innerHTML=`<div class="card res"><div class="big ${pass?'pass':'fail'}">${p}%</div><h2 class="${pass?'pass':'fail'}">${pass?t('ps'):t('fa')}</h2><p>${t('sc')}: <b>${ok} / ${ans}</b> · ${t('pc')}: <b>${p}%</b><br>${t('an')}: ${ans} · ${t('un')}: ${Q.length-ans}<br><small>${t('note')}</small></p><button class="p" onclick="Q=[];location.reload()">${t('rt')}</button></div>
<div class="lay rv">${side(1)}<div class="card"><b>${t('rv')}</b><p class="meta">${t('q')} ${rvIdx+1} ${t('of')} ${Q.length}</p><p class="q" ${dq(Q[rvIdx])}>${qText(Q[rvIdx])}</p>${opts(Q[rvIdx]).map((o,k)=>{const q=Q[rvIdx],u=A[rvIdx];let c='o';if(k==q.c)c+=' ok';else if(k===u)c+=' bad';return`<div class="${c}" ${dro(Q[rvIdx])} style="border:1px solid var(--bd);border-radius:8px;padding:12px 14px;margin-bottom:8px">${o}<div class="tag">${k==q.c?'✔ '+t('ca'):''}${k===u?(k==q.c?' · ':'✘ ')+t('ya'):''}</div></div>`}).join('')}${A[rvIdx]===undefined?`<p class="meta">${t('na')}</p>`:''}<div class="nav"><button onclick="go(${rvIdx-1})" ${rvIdx==0?'disabled':''}>${t('pv')}</button><button onclick="go(${rvIdx+1})" ${rvIdx==Q.length-1?'disabled':''}>${t('nx')}</button></div></div></div>`}
function go(k){if(k<0||k>=Q.length)return;if(mode=='exam')cur=k;else rvIdx=k;render()}
function pick(k){A[cur]=k;render()}
function submit(){if(A.filter(x=>x!==undefined).length<Q.length&&!confirm(t('cf')))return;mode='result';rvIdx=0;render();scrollTo(0,0)}
render();
</script>
</body>
</html>
